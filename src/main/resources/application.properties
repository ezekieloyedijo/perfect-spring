# =============================================================================
# SHARED settings for every Spring Boot app in this project.
# =============================================================================
# This one Maven project contains SEVERAL Spring Boot apps (topics 5-8).
# Each app switches on its own "profile", and that profile has its own file:
#     application-<profile>.properties
# Settings in a profile file OVERRIDE the settings here.
# (Topic 7 explains profiles properly.)

# Spring Cloud libraries are on the classpath for topic 8.
# Switch service discovery OFF by default so the other apps don't
# keep searching for a registry that isn't running.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Spring Security is on the classpath for topic 5. Boot would lock EVERY app
# ("secure by default"). Switch its auto-configuration OFF for all apps here;
# application-security.properties (topic 5) switches it back ON.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Keep the startup logs short and readable for students.
spring.jpa.open-in-view=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.perfectspring=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.boot.StartupInfoLogger=INFO
