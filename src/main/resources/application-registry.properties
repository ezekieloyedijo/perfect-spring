# topic08 - the SERVICE REGISTRY (Eureka server): the campus phone directory.
server.port=8761
spring.application.name=service-registry

eureka.client.enabled=true
spring.cloud.discovery.enabled=true
# The registry doesn't register with itself or download the directory from anyone.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost

# Classroom-friendly settings: notice dead services quickly, no "self preservation" warnings.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.wait-time-in-ms-when-sync-empty=0
