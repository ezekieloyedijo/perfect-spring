# =============================================================================
# Settings for the topic07 Course Registration API ("boot" profile).
# This is Spring Boot's CONTROL PANEL. Change values here, not in Java.
# =============================================================================

# --- Embedded server ---
server.port=8087

# --- Database (H2 in memory; switch the URL/user/password for MySQL or PostgreSQL) ---
spring.datasource.url=jdbc:h2:mem:courses
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop: build the tables from the @Entity classes at start-up, drop them at shut-down
spring.jpa.hibernate.ddl-auto=create-drop
# print the SQL that Spring Data JPA writes for you (great for learning!)
spring.jpa.show-sql=true

# --- H2 web console: http://localhost:8087/h2-console ---
spring.h2.console.enabled=true

# --- Actuator: which monitoring endpoints are visible over HTTP ---
management.endpoints.web.exposure.include=health,info,beans,conditions
management.endpoint.health.show-details=always
info.app.name=Course Registration API
info.app.topic=Topic 7 - Spring Boot

# --- OUR OWN settings, read by SchoolProperties (@ConfigurationProperties) ---
school.name=Unity High School
school.default-course-capacity=30
