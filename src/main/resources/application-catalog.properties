# topic08 - CATALOG SERVICE. Run a 2nd copy with --server.port=8091 to see load balancing.
server.port=8081
# The NAME other services use to find us in the registry:
spring.application.name=catalog-service

eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
# Talk to Eureka with Spring's own HTTP client. (Needed only because this ONE course project
# also contains the Eureka SERVER library. In real life each service is its own project.)
eureka.client.jersey.enabled=false
# Classroom-friendly: send heartbeats often, so we appear/disappear quickly.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
